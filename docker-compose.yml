# 自宅サーバー等での本番運用を想定した構成。
# GitHub Actions がビルドして GHCR に push したイメージを使う(ここではビルドしない)。
# Watchtower がこのイメージの更新を監視し、新しい :latest を検知したら自動 pull → 再作成する
# (Watchtower 自体は別プロジェクトとして1台だけ動かし、有効ラベル付きコンテナ全体を監視する想定)。
services:
  app:
    image: ghcr.io/taaaaaaachu/warranty_remember:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      # adapter-node がリバースプロキシ配下で form action / CSRF 検証に使う公開オリジン。
      # 自分のドメインに合わせて変更する。
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - DATABASE_PATH=/data/app.sqlite
      - UPLOAD_DIR=/data/uploads
      - PORT=3000
      - TZ=Asia/Tokyo
    volumes:
      # バインドマウント: SQLite と添付画像をプロジェクト直下 data/ に置く。
      - ./data:/data
    # 直接ポート公開はせず、共用 cloudflared からのみ到達させる(下記 networks 経由)。
    expose:
      - '3000'
    networks:
      default:
      proxy:
        aliases:
          - warranty_remember-app

networks:
  # cloudflared は NAS 上の共用 compose から同じネットワークに参加する。
  # 初回だけ `docker network create cloudflare-proxy` を実行する(stockify 導入時に作成済みのはず)。
  proxy:
    name: cloudflare-proxy
    external: true
