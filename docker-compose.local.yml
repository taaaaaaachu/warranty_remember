# ローカルでの動作確認専用。GHCR配布・Watchtowerとは別物で、その場でビルドする。
#
#   docker compose -f docker-compose.local.yml up --build
#   → http://localhost:3000
services:
  app:
    build:
      context: .
      args:
        # http://localhost:3000 でアクセスするので、公開オリジンをビルド時に焼き込む。
        # (SvelteKit 3 は実行時の ORIGIN 環境変数を読まない。合っていないとログイン等の POST が CSRF で 403 になる)
        ORIGIN: http://localhost:3000
    image: warranty_remember:local
    restart: 'no'
    environment:
      - DATABASE_PATH=/data/app.sqlite
      - UPLOAD_DIR=/data/uploads
      - PORT=3000
      - TZ=Asia/Tokyo
      - BODY_SIZE_LIMIT=100M
    ports:
      - '3000:3000'
    volumes:
      - ./data:/data
